author: "nauticall"
delete-after: True
changes:
  - rscadd: "Body Type in character creation is now a dropdown with four options - Masculine (Bulky), Masculine (Slim), Feminine (Bulky) and Feminine (Slim) - instead of a Masculine/Feminine toggle."
  - rscadd: "The bulky and slim bodies are now available to Humen, Half-Elf, Half-Kin, Tiefling, Aasimar, Revenant, Murkling, Elf, Sun Elf and Dark Elf."
  - rscadd: "Masculine (Elven) body type remains available exclusively to elves/sun elves/dark elves."
  - qol: "Underwear, stockings and body markings now pick their cut from the body you're actually wearing rather than from your gender."
  - bugfix: "Orc and Half-Orc females now wear properly-sized underewar."
  - bugfix: "Elf males now wear properly-sized underwear."
  - bugfix: "Eoran Briefs should be visible again on all body types."
  - bugfix: "Cloak sleeves checked for the shirt offset while applying the cloak one."
  - refactor: "Body shape is now a 'build' shared between races, so clothing offsets follow the body instead of the species."